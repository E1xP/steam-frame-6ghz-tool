[package]
name = "steam-frame-6ghz-tool"
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.88"
description = "Steam Frame 6 GHz 设置工具"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "=0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Services", "Win32_System_Com", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = "thin"
